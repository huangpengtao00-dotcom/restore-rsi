[project]
name = "restore-rsi"
version = "0.0.1"
description = "JarvisIR restoration loop ported onto reef (self-improving agent infra): toolbox CLI, harness method, task generator."
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pillow>=10", "pyyaml>=6"]

[project.scripts]
restore = "toolbox.cli:_entry"

[project.optional-dependencies]
depth = [
    "torch>=2.4",
    "transformers>=4.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolbox", "harness"]

# reef 侧(reef_example/ 用):reef 仓是本地 clone,editable 引入,不改它的源码。
[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
reef = ["reef-infra", "reef-client>=0.2.0"]

[tool.uv.sources]
reef-infra = { path = "../reef", editable = true }
