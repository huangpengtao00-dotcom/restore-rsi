# restore-rsi as a reef harness_evolve example: one Reef service on port 8900,
# state under ./work. Mirrors reef/tutorials/harness_evolve/serve.yaml; the
# differences are the task source, the grader and the upstream.
#
# This file carries both the deployment (`reef:`, `services:`) and the
# harness_evolve recipe sections (implementation, model, evolution, data). The
# recipe registry reads named recipes from REEF_RECIPE_CONFIG_DIR, so run.sh
# runs materialize.py, which copies those four sections into
# work/recipes/harness_evolve.yaml - with `evolution.tasks` generated from
# tasks/data/manifest.json for the task ids listed under `restore:` below.

implementation: reef.train.cordis_backend.recipe:CordisRecipe

model:
  path: litellm/DeepSeek-V4-Flash

# restore-rsi specific (not read by reef; consumed by materialize.py).
restore:
  manifest: ../tasks/data/manifest.json
  # Composite degradations. The score is PSNR *gain over the degraded input*
  # (toolbox/cli.py: reference_score), so identity is exactly 0.0 on every task
  # and every point is the loop's doing. The ceiling is not guessed -
  # tasks/oracle_chains.py walks every tool sequence exhaustively
  # (2026-09-03, work/oracle_v1_d4.json):
  #                      best<=4  best<=4 chain                        1-tool scores
  #   haze_low_light_00   0.5994  gamma>dcp>gamma>gamma                3 of 6 non-zero
  #   haze_low_light_01   0.3863  dcp>gamma>gamma>gamma                3 of 6
  #   low_light_noise_00  0.6268  median>bilateral>gamma>gamma         4 of 6
  # Under the old absolute scale these were 0.3588 / 0.1775 / 0.1499 with 0-1
  # non-zero single tools, i.e. a first action almost never earned feedback.
  # Note the ceiling is per *step budget* and keeps rising with chain length, so
  # it bounds only a policy under the same budget - never quote it as "the
  # toolbox's ceiling" (README).
  # Each task is evaluated this many times per side, as `repeats` identical
  # entries in evolution.tasks. The gate then decides on 3 x repeats per-task
  # comparisons instead of 3, so the one destructive outlier cannot carry a
  # verdict on its own - and the disagreement *between* a task's repeats is this
  # step's own reliability read-out, instead of something a separate experiment
  # has to go and measure afterwards.
  #
  # Why repeats and not a wider tolerance: the outcome is bimodal, not jittery.
  # One unchanged tree scores 0.2165 four times and 0.0 once, because the policy
  # sometimes appends one step past the good chain and destroys the gain
  # (dehaze>gamma = 0.2165, dehaze>gamma>clahe = 0.0000). A majority over
  # repeats is the right estimator for that shape; a mean is not.
  #
  # Cost: 3 x the episodes per step (18 instead of 6), ~2-3x the wall clock.
  repeats: 3
  task_ids:
    - haze_low_light_00
    - haze_low_light_01
    - low_light_noise_00

evolution:
  adapter: pi
  # 闸门判据。reef 自带的 `score_comparison` 是 `wins > losses`,在这套系统上
  # **假阳性率 50%**,与重复次数无关:候选与现版无差别时每次逐题比较就是抛硬币。
  # 实测代价是每题评估 1 次时连续两步以 2 胜 1 负发布,而事后同一棵树的重复评估
  # 显示那些差(0.01–0.19)远小于噪声(0.15–0.65)。
  # 换成符号检验(harness/selection.py),alpha=0.10:n=9 时需要 ≥7 胜。
  # 不是把闸门调严,是让「发布」第一次有已知的错误率。
  selection: harness.selection:selector
  # The method package beside this file (harness/): reef.service resolves
  # these dotted references because run.sh starts it with this cwd.
  propose: harness.evolution:propose
  evaluate: harness.evolution:evaluate
  binary: pi  # headless coding-agent episodes; run.sh puts bin/ first on PATH
  # Filled by materialize.py from `restore.task_ids` (one prompt per task,
  # see materialize.py:task_prompt). Kept empty here on purpose.
  tasks: []
  # First-boot composition: one empty skill for the proposer to grow. No
  # provider node - reef renders its own model binding (reef.upstream_*) into
  # every evaluation episode.
  seed:
    - id: restore-strategy
      name: skill
      config:
        name: restore-strategy
        text: |
          # restore-strategy

          (empty) Starter skill. The evolution loop replaces this with
          restoration strategy learned from failing tasks.

data:
  # One evolve step per report. Only failing traffic batches: a report with
  # score <= max_score (min_score defaults to 0) enters the batch. The
  # restore score is PSNR normalised to 0..1, so "below 0.5" is the failure
  # window here (the tutorial's exact-match grader used 0.0).
  batch_size: 1
  max_score: 0.5

reef:
  host: 127.0.0.1
  port: 8900
  recipe: harness_evolve
  token: reef-local
  # OpenAI-compatible upstream WITHOUT the /v1 suffix (reef appends it).
  # Reef proxies recorded traffic here, propose()'s models.served.chat goes
  # here, and pi episodes are bound here. Both the endpoint and the key come
  # from the environment (run.sh reads them); neither is ever in this file.
  # Any OpenAI-compatible chat-completions endpoint works - reef appends /v1.
  upstream_url: ${REEF_UPSTREAM_URL}
  upstream_api_key: ${REEF_UPSTREAM_API_KEY}
  upstream_model: litellm/DeepSeek-V4-Flash
  agent_record_dir: work/agent-record
  artifact_repository: work/artifacts.git
  artifact_work_dir: work/artifact-work
  artifact_cache_dir: work/artifact-cache

run_dir: work/stack

services:
  - name: reef
    command: python3 -m reef.service
    ready: curl -sf http://127.0.0.1:${reef.port}/healthz
